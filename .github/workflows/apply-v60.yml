name: Apply SAO2 Ver.6.0

on:
  push:
    paths:
      - '.github/update/v60.patch.gz.b64'
      - '.github/workflows/apply-v60.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Ver.6.0 patch
        shell: bash
        run: |
          set -euo pipefail
          OLD_SHA256='6dcd8800c054a9e8f89ddeb3e84d41a81da27c8a68d2fafe9c0847504291e4e7'
          OLD_BLOB='54f0cd6ebdb25ec8487202b9ab47e0db93cad224'
          NEW_SHA256='9cd3de9146d76d567c233c45c5c197e3a50370ece47b142acfa7852c1f2f2083'
          NEW_BLOB='b70f6bbdac106c614a9524f35df79ca620842be0'
          test "$(sha256sum index.html | awk '{print $1}')" = "$OLD_SHA256"
          test "$(git hash-object index.html)" = "$OLD_BLOB"
          base64 -d .github/update/v60.patch.gz.b64 | gzip -d > /tmp/v60.patch
          git apply --check /tmp/v60.patch
          git apply /tmp/v60.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "$NEW_SHA256"
          test "$(git hash-object index.html)" = "$NEW_BLOB"
          git add index.html
          git rm .github/update/v60.patch.gz.b64 .github/workflows/apply-v60.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update index to Ver.6.0'
          git push origin HEAD:main
