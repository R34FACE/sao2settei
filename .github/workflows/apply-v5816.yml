name: Apply SAO2 Ver.5.8.16
on:
  push:
    paths:
      - '.github/workflows/apply-v5816.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "fc0a349bb4997edcdad887dc4738325e3e6c302977f76386d7eab1bdc129eaf1"
          test "$(git hash-object index.html)" = "2e7e3cd38d5e8d08ea79360f4b01b7578a4e0b66"
          base64 -d .github/update/v5816.patch.gz.b64 | gzip -d > /tmp/v5816.patch
          git apply --check /tmp/v5816.patch
          git apply /tmp/v5816.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "6dcd8800c054a9e8f89ddeb3e84d41a81da27c8a68d2fafe9c0847504291e4e7"
          test "$(git hash-object index.html)" = "54f0cd6ebdb25ec8487202b9ab47e0db93cad224"
      - name: Commit production update and remove temporary updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/update/v5816.patch.gz.b64 .github/workflows/apply-v5816.yml
          git commit -m "Update index to Ver.5.8.16"
          git push origin HEAD:main
