name: Run SAO2 Ver.5.8.11 updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-update-5.8.11.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify Ver.5.8.11
        shell: bash
        run: |
          sed -n '/^H4s/,/^PATCH_B64$/p' .github/workflows/update-5.8.11.yml | sed '$d' > /tmp/update.patch.gz.b64
          base64 -d /tmp/update.patch.gz.b64 | gzip -d > /tmp/update.patch
          sed -i 's#^--- /mnt/data/SAO2_Ver5.8.10.html.*#--- a/index.html#; s#^+++ /mnt/data/SAO2_Ver5.8.11.html.*#+++ b/index.html#' /tmp/update.patch
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "5b325c81d294432617b3de83e9360f572270169cd47de0a4290015a41be0b9b0"
          test "$(git hash-object index.html)" = "023f8a2171878248193fb23e0b9bc1c613a1fd4e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-5.8.11.yml .github/workflows/run-update-5.8.11.yml
          git commit -m "Update index to Ver.5.8.11"
          git push
