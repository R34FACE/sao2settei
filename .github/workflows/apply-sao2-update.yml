name: Apply SAO2 Ver.5.8.6

on:
  push:
    paths:
      - '.github/workflows/apply-sao2-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current index
        shell: bash
        run: |
          set -euo pipefail
          echo "64ff87781dfef3ebdaccc51649927c010e39a71c745008bca186d7fd7a2060b4  index.html" | sha256sum -c -

      - name: Apply audited Ver.5.8.6 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .sao2-update/patch.gz.b64 | gunzip > /tmp/sao2.patch
          patch -p1 < /tmp/sao2.patch
          echo "3fb8ecc550d065096a6f0043cd93fc10fa79e2028b06280b2037f41698aff380  index.html" | sha256sum -c -

      - name: Commit updated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .sao2-update
          git add -A index.html .sao2-update
          git commit -m "Update index to Ver.5.8.6"
          git push origin HEAD:main
