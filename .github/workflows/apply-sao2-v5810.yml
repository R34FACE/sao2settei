name: Apply SAO2 Ver.5.8.10

on:
  push:
    paths:
      - '.github/workflows/apply-sao2-v5810.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify Ver.5.8.10
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('Ver.5.8.9 / CZ Zone Research','Ver.5.8.10 / 800G Ceiling'),
            ('Ver.5.8.9：明示指定したCZ当選地点の派生集計と、保存履歴の過去CZ地点補完を追加。','Ver.5.8.10：CZ当選地点へ、6研究地点とは独立した「800G天井」を追加。'),
            ('<option value="650">650G</option><option value="outside">研究地点外</option>','<option value="650">650G</option><option value="800">800G天井</option><option value="outside">研究地点外</option>'),
            ("const CZ_ZONE_VALUES=['50','100','250','350','500','650','outside','unknown'];","const CZ_ZONE_VALUES=['50','100','250','350','500','650','800','outside','unknown'];"),
            ("const NR_CZ_ZONE_LABELS={'50':'50G','100':'100G','250':'250G','350':'350G','500':'500G','650':'650G',outside:'研究地点外',unknown:'不明'};","const NR_CZ_ZONE_LABELS={'50':'50G','100':'100G','250':'250G','350':'350G','500':'500G','650':'650G','800':'800G天井',outside:'研究地点外',unknown:'不明'};"),
          ]
          for old,new in reps:
              c=s.count(old)
              if c != 1:
                  raise SystemExit(f'expected exactly 1 match, got {c}: {old[:80]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          echo '778591ee883de52ed40a721813ee750d4022244bef5a504afbde2e08dbb82f12  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = 'f2a353400ccc8d41f87b58db67cabe815e81206b'

      - name: Commit index update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already matches Ver.5.8.10'
            exit 0
          fi
          git commit -m 'Update index to Ver.5.8.10'
          git push
