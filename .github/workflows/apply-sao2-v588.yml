name: Cleanup SAO2 Ver.5.8.8

on:
  push:
    paths:
      - '.github/workflows/apply-sao2-v588.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary SAO2 update files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/update/sao2_v588.gz.b64 \
            .github/update/sao2_v588.part1 \
            .github/update/sao2_v588.part2 \
            .github/update/sao2_v588.part3 \
            .github/update/sao2_v588.part4 \
            .github/update/sao2_v588.part5 \
            .github/update/sao2_v588.part5a \
            .github/update/sao2_v588.part5b \
            .github/update/sao2_v588.part5b0 \
            .github/update/sao2_v588.part5b1 \
            .github/update/sao2_v588.part5b2 \
            .github/update/sao2_v588.part5b3 \
            .github/update/sao2_v588.part6 \
            .github/workflows/apply-sao2-v588.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No temporary files to remove'
            exit 0
          fi
          git commit -m 'Remove temporary SAO2 Ver.5.8.8 update files'
          git push
