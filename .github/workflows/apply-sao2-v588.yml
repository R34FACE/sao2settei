name: Apply SAO2 Ver.5.8.8

on:
  push:
    paths:
      - '.github/workflows/apply-sao2-v588.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify Ver.5.8.8
        shell: bash
        run: |
          cat \
            .github/update/sao2_v588.gz.b64 \
            .github/update/sao2_v588.part1 \
            .github/update/sao2_v588.part2 \
            .github/update/sao2_v588.part3 \
            .github/update/sao2_v588.part4 \
            .github/update/sao2_v588.part5a \
            .github/update/sao2_v588.part5b0 \
            .github/update/sao2_v588.part5b1 \
            .github/update/sao2_v588.part5b2 \
            .github/update/sao2_v588.part5b3 \
            .github/update/sao2_v588.part6 > /tmp/sao2_v588.b64
          base64 -d /tmp/sao2_v588.b64 > /tmp/sao2_v588.gz
          gzip -dc /tmp/sao2_v588.gz > index.html
          echo '51d19bd68cddfce34f45eba91eefc9a9b4da1c11e0d55820d4301a6a35d40f5e  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = 'e8e9c100f075bf381bdcb05673ef0f5180ad33a1'

      - name: Commit index update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already matches Ver.5.8.8'
            exit 0
          fi
          git commit -m 'Update index to Ver.5.8.8'
          git push
