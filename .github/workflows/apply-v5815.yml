name: Apply SAO2 Ver.5.8.15

on:
  push:
    paths:
      - '.github/workflows/apply-v5815.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "f421cabfeab0488485e483f59fb332c25b08281d"
          base64 -d .github/v5815.patch.gz.b64 | gzip -d > /tmp/update.patch
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          echo "fc0a349bb4997edcdad887dc4738325e3e6c302977f76386d7eab1bdc129eaf1  index.html" | sha256sum -c -
          test "$(git hash-object index.html)" = "2e7e3cd38d5e8d08ea79360f4b01b7578a4e0b66"
          grep -Fq 'Ver.5.8.15 / Backup &amp; SC Cleanup' index.html
          grep -Fq 'id="backupSave"' index.html
          grep -Fq 'id="backupRestore"' index.html
          ! grep -Fq 'id="exportJson"' index.html
          ! grep -Fq 'id="shootingChargeATHitRate"' index.html
          ! grep -Fq 'id="researchGgoCount"' index.html
          rm -f .github/workflows/apply-v5815.yml .github/v5815.patch.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-v5815.yml .github/v5815.patch.gz.b64
          git commit -m 'Update index to Ver.5.8.15'
          git push
