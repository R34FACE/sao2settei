name: Build SAO2 Ver6.0

on:
  push:
    branches:
      - chatgpt/sao2-ver6-build

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sao2-ver6-build
      - name: Generate and test Ver6.0
        run: python3 build_ver6.py
      - name: Verify master unchanged
        run: git diff --exit-code -- index.html
      - name: Upload completed HTML
        uses: actions/upload-artifact@v4
        with:
          name: SAO2_Ver6.0
          path: SAO2_Ver6.0.html
          if-no-files-found: error
      - name: Commit completed HTML to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SAO2_Ver6.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Create SAO2_Ver6.0 Strong Chance B analysis"
          git push origin HEAD:chatgpt/sao2-ver6-build
