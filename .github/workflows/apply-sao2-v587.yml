name: Cleanup SAO2 Ver.5.8.7

on:
  push:
    paths:
      - '.github/workflows/apply-sao2-v587.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary update files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/update/sao2_v587.gz.b64 \
                .github/update/sao2_v587.part1 \
                .github/update/sao2_v587.part2 \
                .github/update/sao2_v587.part3 \
                .github/update/sao2_v587.part4 \
                .github/update/sao2_v587.part5 \
                .github/update/sao2_v587.part6 \
                .github/workflows/apply-sao2-v587.yml
          git add -A
          git commit -m 'Remove temporary SAO2 Ver.5.8.7 update files'
          git push
