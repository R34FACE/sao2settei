name: Update SAO2 Ver.5.8.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-5.8.12.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify Ver.5.8.12
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "023f8a2171878248193fb23e0b9bc1c613a1fd4e"
          cat > /tmp/update.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/update.patch.gz.b64 | gzip -d > /tmp/update.patch
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "bb7f3ad579c749148d489dcd55edf75343c61135e66068c1fae58a6ef8650902"
          test "$(git hash-object index.html)" = "0d4239b0667af361a08f4a5466a579b70fde6509"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-5.8.12.yml
          git commit -m "Update index to Ver.5.8.12"
          git push
