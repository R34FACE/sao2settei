name: Update SAO2 Ver.5.8.13

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-5.8.13.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify Ver.5.8.13
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0d4239b0667af361a08f4a5466a579b70fde6509"
          cat > /tmp/update.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/update.patch.gz.b64 | gzip -d > /tmp/update.patch
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "aae0e3b8ef45a826e9c9987ecefd076f216a8f3e99d28d78b2331728b86eb92a"
          test "$(git hash-object index.html)" = "8d1d46c29ca00a105f758fc6811e9456d6563f78"
          grep -q 'Ver.5.8.13 / One Hint One Record' index.html
          ! grep -q 'id="researchGgoCount"' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-5.8.13.yml
          git commit -m "Update index to Ver.5.8.13"
          git push
