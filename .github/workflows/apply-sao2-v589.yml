name: Cleanup SAO2 Ver.5.8.9

on:
  push:
    paths:
      - '.github/workflows/apply-sao2-v589.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary update files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/update/sao2_v589.part00 \
            .github/update/sao2_v589.part01 \
            .github/update/sao2_v589.part02 \
            .github/update/sao2_v589.part03 \
            .github/update/sao2_v589.part04 \
            .github/update/sao2_v589.part05 \
            .github/update/sao2_v589.part05a \
            .github/update/sao2_v589.part05b \
            .github/update/sao2_v589.part05b_00 \
            .github/update/sao2_v589.part05b_01 \
            .github/update/sao2_v589.part05b_02 \
            .github/workflows/apply-sao2-v589.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No temporary files to remove'
            exit 0
          fi
          git commit -m 'Remove temporary SAO2 Ver.5.8.9 update files'
          git push
