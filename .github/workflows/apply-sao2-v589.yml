name: Apply SAO2 Ver.5.8.9

on:
  push:
    paths:
      - '.github/workflows/apply-sao2-v589.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify Ver.5.8.9
        shell: bash
        run: |
          cat \
            .github/update/sao2_v589.part00 \
            .github/update/sao2_v589.part01 \
            .github/update/sao2_v589.part02 \
            .github/update/sao2_v589.part03 \
            .github/update/sao2_v589.part04 \
            .github/update/sao2_v589.part05 > /tmp/sao2_v589.b64
          base64 -d /tmp/sao2_v589.b64 > /tmp/sao2_v589.gz
          gzip -dc /tmp/sao2_v589.gz > index.html
          echo '3fa4663bc8c6b7c16f5217effe2806d976b6568daabe8fabf1678ef116d215a0  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = '260d7233ddfbc922e4bbbec823b1515592542cd4'

      - name: Commit index update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already matches Ver.5.8.9'
            exit 0
          fi
          git commit -m 'Update index to Ver.5.8.9'
          git push
